<!doctype html><html lang="ja"><meta charset="utf-8"><title>模擬業務ワークスペース</title><style>body{font:15px system-ui;background:#edf2f8;color:#192235;margin:20px}header{display:flex;justify-content:space-between}.grid{display:grid;grid-template-columns:1fr 1fr;gap:20px}section{background:white;padding:18px;border-radius:12px}video{width:100%;height:190px;background:#101624}.sheet,.slides{height:360px;overflow:auto}table{border-collapse:collapse;width:100%}td{padding:5px;border-bottom:1px solid #ddd}canvas{width:100%}input,button{padding:10px}#metrics{font-family:monospace}</style><header><h1>模擬業務 / 売上資料レビュー</h1><p id="metrics">準備中</p></header><div class="grid"><section><h2>会議映像（ローカル生成）</h2><video autoplay muted playsinline></video><p>ローカルWebRTCで映像を送受信。12人の図形を1本の映像に合成。実際のTeams・カメラ・外部通信ではありません。</p><h2>1080p動画（ローカル生成・圧縮済み）</h2><video id="movie" autoplay muted loop playsinline></video><h2>地図・経路再検索（架空の道路網）</h2><canvas id="map" width="900" height="600"></canvas><p id="routeStatus">待機中</p><h2>資料プレビュー：24枚</h2><div class="slides"></div></section><section><h2>売上データ 200,000行</h2><input placeholder="部署を検索" value="部署1"><button onclick="businessStep()">検索・並べ替え・再集計</button><p id="total"></p><div class="sheet"><table></table></div></section></div><script>
const rows=Array.from({length:200000},(_,i)=>({id:i,department:'部署'+i%40,sales:((i*7919)%1000000)/100,date:'2026-09-'+(i%28+1)}));
const slideBox=document.querySelector('.slides');for(let j=0;j<24;j++){const c=document.createElement('canvas');c.width=1920;c.height=1080;const x=c.getContext('2d');x.fillStyle=`hsl(${j*24} 40% 90%)`;x.fillRect(0,0,1600,900);x.fillStyle='#203555';x.font='60px sans-serif';x.fillText('営業レポート / '+(j+1),60,100);for(let n=0;n<150;n++){x.fillStyle=`hsl(${n*9} 65% 45%)`;x.fillRect(60+n*10,800-(n*71%600),7,n*71%600)}slideBox.append(c)}
let videoTimer,stream,expiry;const source=document.createElement('canvas');source.width=1280;source.height=720;const ctx=source.getContext('2d');
function stopBaseBusiness(){clearInterval(videoTimer);clearTimeout(expiry);if(stream)stream.getTracks().forEach(t=>t.stop());document.querySelector('video').srcObject=null}
function startBaseBusiness(duration=240000){stopBaseBusiness();stream=source.captureStream(30);document.querySelector('video').srcObject=stream;document.querySelector('video').play().catch(()=>{});let tick=0;videoTimer=setInterval(()=>{tick++;for(let i=0;i<12;i++){const x=i%4*320,y=Math.floor(i/4)*240;ctx.fillStyle=`hsl(${(i*31+tick)%360} 40% 35%)`;ctx.fillRect(x,y,320,240);ctx.fillStyle='#fff';ctx.font='24px sans-serif';ctx.fillText('参加者 '+(i+1),x+25,y+40);ctx.beginPath();ctx.arc(x+160+Math.sin(tick/15+i)*30,y+120,45,0,Math.PI*2);ctx.fill()}},33);expiry=setTimeout(stopBusiness,Math.min(duration,720000))}
let step=0;async function businessStep(){const begin=performance.now();step++;const query='部署'+step%10;document.querySelector('input').value=query;rows[(step*997)%rows.length].sales+=10;const selected=rows.filter(r=>r.department.includes(query)).sort((a,b)=>step%2?a.sales-b.sales:b.sales-a.sales);const sum=selected.reduce((n,r)=>n+r.sales,0);document.querySelector('table').innerHTML=selected.slice(0,1200).map(r=>`<tr><td>${r.id}</td><td>${r.department}</td><td>${r.sales.toFixed(2)}</td><td>${r.date}</td></tr>`).join('');document.querySelector('#total').textContent=`${selected.length}件 / 合計 ${sum.toFixed(2)}`;document.querySelector('.sheet').scrollTop=(step*180)%12000;slideBox.scrollTop=(step*250)%4500;const compute=performance.now()-begin;await new Promise(r=>requestAnimationFrame(()=>requestAnimationFrame(r)));const paint=performance.now()-begin;document.querySelector('#metrics').textContent=`操作 ${step} / JS ${compute.toFixed(1)}ms / 描画待ち込み ${paint.toFixed(1)}ms`;return {step,compute_ms:compute,paint_ms:paint,visible:document.visibilityState,...workloadMetrics(),video_frames:document.querySelector('video').getVideoPlaybackQuality().totalVideoFrames}}

</script><script>
let routeWorker, peers=[], movieExpiry, active=false;
let routes=0, routeMs=0, rtcFrames=0, mediaError='';
function workloadMetrics(){const q=document.querySelector('#movie').getVideoPlaybackQuality();return {route_searches:routes,route_ms:routeMs,movie_frames:q.totalVideoFrames,movie_dropped:q.droppedVideoFrames,rtc_frames:rtcFrames,media_error:mediaError}}
function stopBusiness(){active=false;stopBaseBusiness();clearTimeout(movieExpiry);if(routeWorker)routeWorker.terminate();routeWorker=null;peers.forEach(p=>p.close());peers=[];const v=document.querySelector('#movie');v.pause();v.removeAttribute('src');v.load();}
async function startBusiness(conference=true,duration=240000){
 stopBusiness();active=true;routes=0;rtcFrames=0;mediaError='';movieExpiry=setTimeout(stopBusiness,Math.min(duration,720000));
 try{
 let receiver=null;
 if(conference){
 startBaseBusiness(duration);
 const sender=new RTCPeerConnection({iceServers:[]}),remote=new RTCPeerConnection({iceServers:[]});receiver=remote;peers=[sender,receiver];
 const received=new Promise(resolve=>receiver.ontrack=e=>{document.querySelector('video').srcObject=e.streams[0];resolve()});
 // Exchange ICE after gathering completes so no candidate is lost before the remote SDP exists.
 async function gather(pc){if(pc.iceGatheringState==='complete')return;await new Promise((resolve,reject)=>{const timer=setTimeout(()=>reject(Error('ICE timeout')),5000);pc.addEventListener('icegatheringstatechange',()=>{if(pc.iceGatheringState==='complete'){clearTimeout(timer);resolve()} });})}
 stream.getTracks().forEach(t=>sender.addTrack(t,stream));
 await sender.setLocalDescription(await sender.createOffer());await gather(sender);
 await receiver.setRemoteDescription(sender.localDescription);await receiver.setLocalDescription(await receiver.createAnswer());await gather(receiver);
 await sender.setRemoteDescription(receiver.localDescription);await received;
 }
 document.querySelector('#movie').src='__MOVIE_URL__';await document.querySelector('#movie').play();
 const code=`let iteration=0;function search(){const start=performance.now(),n=160,total=n*n,prev=new Int32Array(total).fill(-1),queue=new Int32Array(total);let head=0,tail=1;const origin=(iteration*977)%total,goal=(origin+total/2+79)%total;queue[0]=origin;prev[origin]=origin;while(head<tail){const v=queue[head++];if(v===goal)break;for(const w of [v%n>0?v-1:-1,v%n<n-1?v+1:-1,v-n,v+n]){if(w<0||w>=total||prev[w]!==-1)continue;const x=w%n,y=Math.floor(w/n);if(x%13===6&&y%11!==0)continue;prev[w]=v;queue[tail++]=w}}const path=[];if(prev[goal]!==-1){let v=goal;while(v!==origin){path.push(v);v=prev[v]}path.push(origin)}postMessage({iteration:++iteration,path,visited:tail,ms:performance.now()-start});setTimeout(search,500)}search()`;
 const url=URL.createObjectURL(new Blob([code],{type:'application/javascript'}));routeWorker=new Worker(url);URL.revokeObjectURL(url);
 routeWorker.onmessage=async e=>{const r=e.data;routes=r.iteration;routeMs=r.ms;const canvas=document.querySelector('#map'),m=canvas.getContext('2d');m.fillStyle='#e8eedf';m.fillRect(0,0,900,600);m.strokeStyle='#bcc7b3';m.beginPath();for(let i=0;i<160;i++){m.moveTo(i*900/160,0);m.lineTo(i*900/160,600);m.moveTo(0,i*600/160);m.lineTo(900,i*600/160)}m.stroke();m.fillStyle='#777';for(let x=6;x<160;x+=13)for(let y=0;y<160;y++)if(y%11!==0)m.fillRect(x*900/160,y*600/160,900/160,600/160);m.strokeStyle='#1267eb';m.lineWidth=4;m.beginPath();r.path.forEach((v,i)=>{const x=v%160*900/160,y=Math.floor(v/160)*600/160;i?m.lineTo(x,y):m.moveTo(x,y)});m.stroke();document.querySelector('#routeStatus').textContent='再検索 '+routes+'回 / 探索 '+r.visited+'地点 / '+r.ms.toFixed(1)+'ms';try{if(receiver)for(const stat of (await receiver.getStats()).values())if(stat.type==='inbound-rtp'&&stat.kind==='video')rtcFrames=stat.framesDecoded||0}catch(e){if(active)mediaError=e.message}};
 }catch(e){mediaError=e.message;stopBusiness();throw e}
}
window.addEventListener('pagehide',stopBusiness);businessStep();
</script>
</html>
