<!doctype html><html lang="ja"><meta charset="utf-8"><title>模擬業務ワークスペース</title><style>body{font:15px system-ui;background:#edf2f8;color:#192235;margin:20px}header{display:flex;justify-content:space-between}.grid{display:grid;grid-template-columns:1fr 1fr;gap:20px}section{background:white;padding:18px;border-radius:12px}video{width:100%;height:190px;background:#101624}.sheet,.slides{height:360px;overflow:auto}table{border-collapse:collapse;width:100%}td{padding:5px;border-bottom:1px solid #ddd}canvas{width:100%}input,button{padding:10px}#metrics{font-family:monospace}</style><header><h1>模擬業務 / 売上資料レビュー</h1><p id="metrics">準備中</p></header><div class="grid"><section><h2>会議映像（ローカル生成）</h2><video autoplay muted playsinline></video><p>Canvas → MediaStream → Video。実際のTeams・通信・カメラではありません。</p><h2>資料プレビュー</h2><div class="slides"></div></section><section><h2>売上データ 200,000行</h2><input placeholder="部署を検索" value="部署1"><button onclick="businessStep()">検索・並べ替え・再集計</button><p id="total"></p><div class="sheet"><table></table></div></section></div><script>
const rows=Array.from({length:200000},(_,i)=>({id:i,department:'部署'+i%40,sales:((i*7919)%1000000)/100,date:'2026-09-'+(i%28+1)}));
const slideBox=document.querySelector('.slides');for(let j=0;j<12;j++){const c=document.createElement('canvas');c.width=1600;c.height=900;const x=c.getContext('2d');x.fillStyle=`hsl(${j*24} 40% 90%)`;x.fillRect(0,0,1600,900);x.fillStyle='#203555';x.font='60px sans-serif';x.fillText('営業レポート / '+(j+1),60,100);for(let n=0;n<150;n++){x.fillStyle=`hsl(${n*9} 65% 45%)`;x.fillRect(60+n*10,800-(n*71%600),7,n*71%600)}slideBox.append(c)}
let videoTimer,stream,expiry;const source=document.createElement('canvas');source.width=1280;source.height=720;const ctx=source.getContext('2d');
function stopBusiness(){clearInterval(videoTimer);clearTimeout(expiry);if(stream)stream.getTracks().forEach(t=>t.stop());document.querySelector('video').srcObject=null}
function startBusiness(){stopBusiness();stream=source.captureStream(30);document.querySelector('video').srcObject=stream;document.querySelector('video').play().catch(()=>{});let tick=0;videoTimer=setInterval(()=>{tick++;for(let i=0;i<12;i++){const x=i%4*320,y=Math.floor(i/4)*240;ctx.fillStyle=`hsl(${(i*31+tick)%360} 40% 35%)`;ctx.fillRect(x,y,320,240);ctx.fillStyle='#fff';ctx.font='24px sans-serif';ctx.fillText('参加者 '+(i+1),x+25,y+40);ctx.beginPath();ctx.arc(x+160+Math.sin(tick/15+i)*30,y+120,45,0,Math.PI*2);ctx.fill()}},33);expiry=setTimeout(stopBusiness,240000)}
let step=0;async function businessStep(){const begin=performance.now();step++;const query='部署'+step%10;document.querySelector('input').value=query;rows[(step*997)%rows.length].sales+=10;const selected=rows.filter(r=>r.department.includes(query)).sort((a,b)=>step%2?a.sales-b.sales:b.sales-a.sales);const sum=selected.reduce((n,r)=>n+r.sales,0);document.querySelector('table').innerHTML=selected.slice(0,1200).map(r=>`<tr><td>${r.id}</td><td>${r.department}</td><td>${r.sales.toFixed(2)}</td><td>${r.date}</td></tr>`).join('');document.querySelector('#total').textContent=`${selected.length}件 / 合計 ${sum.toFixed(2)}`;document.querySelector('.sheet').scrollTop=(step*180)%12000;slideBox.scrollTop=(step*250)%4500;const compute=performance.now()-begin;await new Promise(r=>requestAnimationFrame(()=>requestAnimationFrame(r)));const paint=performance.now()-begin;document.querySelector('#metrics').textContent=`操作 ${step} / JS ${compute.toFixed(1)}ms / 描画待ち込み ${paint.toFixed(1)}ms`;return {step,compute_ms:compute,paint_ms:paint,visible:document.visibilityState,video_frames:document.querySelector('video').getVideoPlaybackQuality().totalVideoFrames}}
window.addEventListener('pagehide',stopBusiness);businessStep();
</script></html>
